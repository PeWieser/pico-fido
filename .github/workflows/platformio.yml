# PlatformIO build for the ESP32-S3 firmware (see platformio.ini and docs/platformio/README.md).
# Builds the environments esp32s3 and esp32s3_dev. The secure environment needs a signing key and burns
# eFuses, so it is not built here.
#
# Result: the job summary (Actions run page) shows the status and, on failure, the first error lines.
# The full log is uploaded as artifact "platformio-log-<env>".
name: "PlatformIO build (ESP32-S3)"

on:
  push:
    branches: [ "arena/**", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: [ esp32s3, esp32s3_dev ]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Show resolved configuration
        run: pio project config -e "${{ matrix.env }}"

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          pio run -e "${{ matrix.env }}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=PlatformIO build failed (${{ matrix.env }})::exit code $rc, see the job summary"
          fi
          exit "$rc"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          rc="${{ steps.build.outputs.rc }}"
          {
            echo "## PlatformIO build: \`${{ matrix.env }}\`"
            echo ""
            if [ "$rc" = "0" ]; then
              echo "**Result: success** (exit code 0)"
              echo ""
              echo "Output files:"
              echo '```'
              ls -la .pio/build/${{ matrix.env }}/*.bin 2>/dev/null || echo "(no .bin found)"
              echo '```'
            else
              echo "**Result: failed** (exit code ${rc:-unknown})"
              echo ""
              echo "### First error lines"
              echo '```'
              if [ -f build.log ]; then
                grep -n -E "error|Error|ERROR|FAILED|undefined reference|No such file|Traceback|HTTPClientError|Could not|not found" build.log | head -40 || true
              else
                echo "build.log missing"
              fi
              echo '```'
              echo ""
              echo "### Last 40 log lines"
              echo '```'
              tail -n 40 build.log 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-log-${{ matrix.env }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware image
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: warn
