# PlatformIO build for the ESP32-S3 firmware (see platformio.ini and docs/platformio/README.md).
# Builds the environments esp32s3 and esp32s3_dev. The secure environment needs a signing key and burns
# eFuses, so it is not built here.
#
# Results are reported in two places:
#   - the job summary on the Actions run page,
#   - a commit comment on the tested commit (status, first error lines, log tail), which can be read via the API.
# The full logs are uploaded as artifacts "platformio-log-<env>".
name: "PlatformIO build (ESP32-S3)"

on:
  push:
    branches: [ "arena/**", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # needed only for the commit comment with the result
    strategy:
      fail-fast: false
      matrix:
        env: [ esp32s3, esp32s3_dev ]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        id: install
        shell: bash
        run: |
          set +e
          pip install -U platformio > install.log 2>&1
          rc=$?
          pio --version >> install.log 2>&1
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat install.log
          exit 0

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set +e
          pio project config -e "${{ matrix.env }}" > config.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat config.log
          exit 0

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          pio run -e "${{ matrix.env }}" > build.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tail -n 200 build.log
          exit 0

      - name: Job summary and report
        id: report
        if: always()
        shell: bash
        env:
          ENV_NAME: ${{ matrix.env }}
          CFG_RC: ${{ steps.config.outputs.rc }}
          BUILD_RC: ${{ steps.build.outputs.rc }}
          PIO_INSTALL_RC: ${{ steps.install.outputs.rc }}
        run: |
          set +e
          {
            echo "# PlatformIO build \`${ENV_NAME}\`"
            echo ""
            echo "| Step | Exit code |"
            echo "|---|---|"
            echo "| Install PlatformIO | ${PIO_INSTALL_RC:-not run} |"
            echo "| Resolve configuration | ${CFG_RC:-not run} |"
            echo "| Build | ${BUILD_RC:-not run} |"
            echo ""
            if [ "${BUILD_RC}" = "0" ] && [ "${CFG_RC}" = "0" ]; then
              echo "**Result: success.**"
            else
              echo "**Result: failed.**"
            fi
            echo ""
            echo "## Key lines (error, failed, undefined, not found)"
            echo '```'
            for f in install.log config.log build.log; do
              [ -f "$f" ] && grep -n -E -i "error|failed|undefined reference|no such file|traceback|exception|could not|not found|httpclient|invalid|unknown" "$f" | head -30
            done
            echo '```'
            echo ""
            echo "## Full configuration output (config.log, first 150 lines)"
            echo '```'
            [ -f config.log ] && head -n 150 config.log
            echo '```'
            echo ""
            echo "## Build output (build.log, last 80 lines)"
            echo '```'
            [ -f build.log ] && tail -n 80 build.log
            echo '```'
          } > report.md 2>/dev/null
          wc -l report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post commit comment with the result
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${REPO}/commits/${SHA}/comments" -F body=@report.md > /dev/null \
            && echo "comment posted" || echo "could not post comment"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-log-${{ matrix.env }}
          path: |
            install.log
            config.log
            build.log
          if-no-files-found: ignore

      - name: Upload firmware image
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: warn
