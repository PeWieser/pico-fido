name: "Emulation and test"

on:
  push:
    branches: [ "main", "development", "eddsa", "arena/**" ]
  pull_request:
    branches: [ "main", "development", "eddsa" ]
  schedule:
    - cron: '23 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r558-and-host-tests:
    name: R558 sensor, engine & full-stack CTAP 2.1 cold-boot tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install fido2==2.2.1 cbor2 cryptography pycvc pytest inputimeout
      - name: Build Linux emulator with R558 support
        run: |
          cmake -S . -B /tmp/emu_build -DENABLE_EMULATION=1 -DENABLE_R558_FINGERPRINT=1
          cmake --build /tmp/emu_build -j"$(nproc)"
          ctest --test-dir /tmp/emu_build --output-on-failure
      - name: Run R558 UART packet, engine & full-stack CTAP 2.1 cold-boot suites
        run: |
          SITE_PKGS=$(/tmp/venv/bin/python3 -c 'import site; print(site.getsitepackages()[0])')
          cp -R tests/docker/fido2/* "$SITE_PKGS/fido2/hid/"
          ./tests/fingerprint/run_r558_sensor_test.sh
          PICO_FIDO_EMU_BUILD=/tmp/emu_build ./tests/fingerprint/run_r558_engine_test.sh
          /tmp/venv/bin/python3 ./tests/fingerprint/run_full_stack_ctap_test.py /tmp/emu_build/pico_fido

  build:
    name: Full Docker FIDO2 / CCID / OATH / OTP conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Checkout legacy firmware and submodules
        uses: actions/checkout@v6
        with:
          ref: 43cf570ac3ba4ad8a40685d4bf2c7ccb8d43b2fa
          path: legacy
          submodules: recursive
          persist-credentials: false
      - name: Build in container
        run: ./tests/build-in-docker.sh
      - name: Build legacy emulator in container
        run: ./tests/build-legacy-in-docker.sh
      - name: Start emulation and test
        env:
          PICO_FIDO_VAULT_ENROLLMENT_JSON: ${{ secrets.PICO_FIDO_VAULT_ENROLLMENT_JSON }}
          PICO_FIDO_VAULT_PASSPHRASE: ${{ secrets.PICO_FIDO_VAULT_PASSPHRASE }}
        run: ./tests/run-test-in-docker.sh
      - name: Test legacy flash compatibility
        run: ./tests/run-test-041-in-docker.sh
      - name: Test silent authentication after restart
        run: ./tests/run-test-042-in-docker.sh
