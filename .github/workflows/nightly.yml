name: "Nightly deploy"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Deploy nightly
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        refs: [main]
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_PATH: ${{ github.workspace }}/../private.pem
      PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
    steps:
      - name: Check signing secret availability
        id: check_secret
        run: |
          if [ -z "${PRIVATE_KEY_B64}" ]; then
            echo "PRIVATE_KEY_B64 secret not configured in this repository; skipping signed nightly deploy cleanly."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.refs }}
          submodules: 'recursive'
          persist-credentials: false
      - name: Restore private key
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          echo "${PRIVATE_KEY_B64}" | base64 -d > "${SIGNING_KEY_PATH}"
          chmod 600 "${SIGNING_KEY_PATH}"
      - name: Build
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          PICO_SDK_PATH: ../pico-sdk
          SECURE_BOOT_PKEY: ${{ github.workspace }}/../private.pem
        run: |
          ./workflows/autobuild.sh pico
          ./build_pico_fido.sh --no-eddsa
          ./workflows/autobuild.sh esp32
      - name: Delete private key
        if: always()
        run: rm -f "${SIGNING_KEY_PATH}"
      - name: Update nightly release
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: pyTooling/Actions/releaser@v6.7.0
        with:
          tag: nightly-${{ matrix.refs }}
          rm: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release/*.*
