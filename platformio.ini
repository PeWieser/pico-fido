; PlatformIO build for Pico FIDO on the ESP32-S3 (e.g. "Super Mini" boards).
;
; The firmware is an ESP-IDF project. PlatformIO runs the same CMake build as idf.py:
;   - root CMakeLists.txt (project.cmake), components in src/fido and pico-keys-sdk/
;   - ESP-IDF settings from pico-keys-sdk/config/esp32/sdkconfig.defaults
;   - the R558 fingerprint sensor is enabled by default on ESP_PLATFORM
;
; Before the first build:  git submodule update --init --recursive
; Build:                   pio run
; Flash:                   pio run -t upload   (see docs/platformio/README.md)

[platformio]
src_dir = main

[env:esp32s3]
; Pin the platform so the build does not change under you. espressif32 6.12.0 uses ESP-IDF 5.5.0
; (framework-espidf ~3.50500.0). The repo's autobuild.sh uses ESP-IDF v5.5.1 from git instead.
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
; Super Mini boards usually have 4 MB flash. sdkconfig.defaults and partitions.csv assume 4 MB.
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = pico-keys-sdk/config/esp32/partitions.csv
; Use the repository's ESP-IDF defaults with an absolute path, independent of the working directory.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/pico-keys-sdk/config/esp32/sdkconfig.defaults
; No platform_packages override: framework-espidf is taken from the platform (~3.50500.0).
; A pin to ~3.50501.0 is not available in the PlatformIO registry (UnknownPackageError).
monitor_speed = 115200
; upload_port = /dev/ttyACM0      ; set this if auto-detection picks the wrong port

; Secure boot + flash encryption (R1). Burns eFuses, cannot be undone. Read docs/platformio/README.md first.
; Needs a local signing key: secure_boot_signing_key.pem in the project root (never commit it).
[env:esp32s3_secure]
extends = env:esp32s3
board_build.partitions = config/esp32/partitions_secure.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/pico-keys-sdk/config/esp32/sdkconfig.defaults;${PROJECT_DIR}/config/esp32/sdkconfig.secure.defaults"

; Development build: like esp32s3, but R558 pairing is allowed without flash encryption.
; The sensor password is then stored in plaintext flash. Use only on bench boards.
[env:esp32s3_dev]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/pico-keys-sdk/config/esp32/sdkconfig.defaults;${PROJECT_DIR}/config/esp32/sdkconfig.dev.defaults"
